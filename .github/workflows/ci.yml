name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check src
      - name: dbt parse (no database needed)
        working-directory: transform
        run: uv run dbt parse
      - name: CLI smoke
        run: uv run alb --help

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck and build the site against the committed snapshot
        run: npx turbo run typecheck build --filter=web
