services:
  postgres:
    image: postgres:16
    container_name: albiceleste-postgres
    environment:
      POSTGRES_USER: alb
      POSTGRES_PASSWORD: alb
      POSTGRES_DB: albiceleste
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alb -d albiceleste"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
