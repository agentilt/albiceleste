version: 2
models:
  - name: int_wikidata_eligibility
    columns:
      - name: wikidata_qid
        tests: [unique, not_null]
      - name: eligibility_status
        tests:
          - accepted_values: {values: ['eligible', 'review', 'youth_only']}
  - name: int_players
    columns:
      - name: player_key
        tests: [unique, not_null]
      - name: espn_athlete_id
        tests: [unique]
  - name: int_player_xref_espn
    columns:
      - name: athlete_id
        tests: [unique]
      - name: wikidata_qid
        tests: [unique]
  - name: int_team_xref
    columns:
      - name: espn_team_id
        tests: [not_null]
  - name: int_match_xref
    columns:
      - name: event_id
        tests: [unique, not_null]
      - name: hl_match_id
        tests: [unique]
  - name: int_player_xref_hl
    columns:
      - name: hl_player_id
        tests: [unique, not_null]
      - name: athlete_id
        tests: [not_null]
  - name: int_player_match_sequence
    columns:
      - name: player_match_key
        tests: [unique, not_null]
  - name: int_player_xref_tm
    columns:
      - name: player_key
        tests: [unique, not_null]
      - name: tm_player_id
        tests: [unique, not_null]
