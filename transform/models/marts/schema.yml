version: 2
models:
  - name: dim_player
    description: One row per tracked player (Wikidata-eligible, or Argentine per ESPN/football-data squads), with senior-eligibility flags and current club.
    columns:
      - name: player_key
        tests: [unique, not_null]
      - name: eligibility_status
        tests:
          - accepted_values: {values: ['eligible', 'review', 'youth_only']}
  - name: dim_team
    columns:
      - name: team_key
        tests: [unique, not_null]
  - name: dim_competition
    columns:
      - name: league
        tests: [unique, not_null]
  - name: fct_match
    columns:
      - name: match_key
        tests: [unique, not_null]
      - name: hl_match_id
        tests: [unique]
  - name: fct_player_match_stats
    description: Per tracked player per match; Highlightly primary, ESPN fallback.
    columns:
      - name: player_match_key
        tests: [unique, not_null]
      - name: player_key
        tests:
          - relationships: {to: ref('dim_player'), field: player_key}
      - name: match_key
        tests:
          - relationships: {to: ref('fct_match'), field: match_key}
      - name: stats_source
        tests:
          - accepted_values: {values: ['highlightly', 'espn']}
  - name: player_season_stats
  - name: player_recent_form
  - name: argentine_players_abroad
  - name: argentine_league_presence
  - name: dq_unmatched
  - name: player_focus_set
    description: Default attention set — everyone abroad plus Argentine-league players who meet an explicit rule; `reasons` explains each membership.
    columns:
      - name: player_key
        tests: [unique, not_null]
  - name: player_source_ids
  - name: player_events
    description: Detected events with evidence; match-based events carry the match date, window-based ones are as of the build date.
    columns:
      - name: event_key
        tests: [unique, not_null]
      - name: event_type
        tests:
          - accepted_values:
              values: ['club_change', 'first_start_of_season', 'consecutive_starts', 'scoring_streak', 'multi_goal_match', 'return_after_absence', 'debut_in_league', 'minutes_surge', 'minutes_drop', rank_move, selection_called, selection_left_out]
      - name: severity
        tests:
          - accepted_values: {values: [1, 2, 3], quote: false}
      - name: player_key
        tests:
          - relationships: {to: ref('dim_player'), field: player_key}
  - name: watch_feed
    description: Recent events for focus-set players, newest and most severe first.
  - name: player_career_history
    description: Transfermarkt transfers for tracked players with competition/country on both ends and age at transfer.
  - name: player_season_history
    description: Per-season club statistics from Transfermarkt appearances (all competitions), frozen at June 2026.
  - name: player_market_values
  - name: argentine_export_pipeline
    description: First move abroad from an Argentine club, for every Argentine in the Transfermarkt snapshot.
    columns:
      - name: tm_player_id
        tests: [unique, not_null]
  - name: argentine_export_summary
  - name: argentine_exporting_clubs
  - name: selection_windows
    description: Hand-kept FIFA windows with the size of each published list.
    columns:
      - name: window_id
        tests: [unique, not_null]
  - name: squad_lists
    description: Every row of every published squad list, resolved to a player key where possible.
  - name: youth_events
  - name: nt_status
  - name: method_parameters
    description: Score thresholds, position weights and Movers importance weights, for About the data.
    columns:
      - name: kind
        tests:
          - accepted_values: {values: ['threshold', 'weight', 'event_weight']}
