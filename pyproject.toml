[project]
name = "albiceleste"
version = "0.1.0"
description = "Argentina football intelligence platform — ingestion, storage and transformation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "rich>=13",
  "dbt-core>=1.9",
  "dbt-postgres>=1.9",
]

[project.scripts]
alb = "albiceleste.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/albiceleste"]
